name: ncet-verifyflow
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ncet_verifyflow
      POSTGRES_USER: ncet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in private .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncet -d ncet_verifyflow"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
  web:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:10000"
    environment:
      PORT: "10000"
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS origin in private .env}
      DATABASE_URL: postgresql+psycopg://ncet:${POSTGRES_PASSWORD}@database:5432/ncet_verifyflow
      STORAGE_BACKEND: database
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set encryption key in private .env}
      NCET_BOOTSTRAP_ADMIN_PASSWORD: ${NCET_BOOTSTRAP_ADMIN_PASSWORD:?Set new admin password in private .env}
      SCAN_MODE: ${SCAN_MODE:-off}
    networks: [internal]
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      web:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ncet:${POSTGRES_PASSWORD}@database:5432/ncet_verifyflow
      STORAGE_BACKEND: database
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set encryption key in private .env}
    networks: [internal]
volumes:
  postgres_data:
networks:
  internal:
