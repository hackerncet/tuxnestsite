name: NCET Security Audit

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: Python SAST and dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install audit tooling
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.7,<3"
      - name: Check medium/high-severity code patterns
        run: bandit -q -r app -ll -ii
      - name: Audit published dependency vulnerabilities
        run: pip-audit -r requirements.txt

