name: NCET VerifyFlow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vps-installer-matrix:
    name: VPS installer checks - Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["22.04", "24.04", "26.04"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check Docker Compose is available on this runner
        run: docker compose version
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Validate Ubuntu installer and update scripts
        run: |
          for script in deploy/ubuntu-one-command.sh deploy/ubuntu-install.sh deploy/vps-update.sh deploy/vps-public-smoke.sh; do bash -n "$script"; done
          shellcheck deploy/ubuntu-one-command.sh deploy/ubuntu-install.sh deploy/vps-update.sh deploy/vps-public-smoke.sh
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-placeholder-password
          PUBLIC_HOST: verify.example.edu
          PUBLIC_ORIGIN: https://verify.example.edu
          SETTINGS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          NCET_BOOTSTRAP_ADMIN_PASSWORD: ci-only-placeholder-password
        run: docker compose config --quiet
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install OCR runtime used in production Docker image
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck tesseract-ocr tesseract-ocr-eng
      - name: Check deployment script syntax
        run: for script in deploy/ubuntu-one-command.sh deploy/ubuntu-install.sh deploy/vps-update.sh deploy/vps-public-smoke.sh; do bash -n "$script"; done
      - name: Lint deployment shell scripts
        run: shellcheck deploy/ubuntu-one-command.sh deploy/ubuntu-install.sh deploy/vps-update.sh deploy/vps-public-smoke.sh
      - name: Validate production Compose configuration and private scanner service
        env:
          POSTGRES_PASSWORD: ci-only-placeholder-password
          PUBLIC_HOST: verify.example.edu
          PUBLIC_ORIGIN: https://verify.example.edu
          SETTINGS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          NCET_BOOTSTRAP_ADMIN_PASSWORD: ci-only-placeholder-password
          SCAN_MODE: clamav
          CLAMAV_HOST: clamav
          CLAMAV_PORT: "3310"
          DEEPSEEK_API_KEY: ci-only-deepseek-key
          DEEPSEEK_MODEL: ci-deepseek-model
          OPENROUTER_API_KEY: ci-only-openrouter-key
          OPENROUTER_DEEPSEEK_MODEL: ci-openrouter-model
        run: |
          docker compose config --quiet
          docker compose config --format json > "$RUNNER_TEMP/ncet-compose.json"
          python - "$RUNNER_TEMP/ncet-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]
          assert "clamav" in services
          for service_name in ("web", "worker"):
              environment = services[service_name]["environment"]
              assert environment["DEEPSEEK_API_KEY"] == "ci-only-deepseek-key"
              assert environment["DEEPSEEK_MODEL"] == "ci-deepseek-model"
              assert environment["OPENROUTER_API_KEY"] == "ci-only-openrouter-key"
              assert environment["OPENROUTER_DEEPSEEK_MODEL"] == "ci-openrouter-model"
          PY
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q tests/test_*.py
      - run: alembic upgrade head
      - name: Check migration drift
        run: alembic check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - run: node --check static/app.js && node --check static/tasks.js && node --check static/plot.js
      - run: node --check static/notifications.js && node --check static/bca-oversight.js && node --check static/community.js && node --check static/student-portal.js && node --check static/bca-management.js && node --check static/public-home.js && node --check static/student-directory.js && node --check static/ncet-loading.js
      - run: node --check static/institutional-ui.js
      - run: node --check static/hod-dashboard.js && node --check static/complaints-dashboard.js && node --check static/bca-management.js

  browser:
    name: Chromium multi-role UI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium and runtime libraries
        run: python -m playwright install --with-deps chromium
      - name: Test Admin, HOD, Staff, Principal, IQAC and mobile UI
        run: python tests/browser_ui.py && python tests/browser_bca.py && python tests/browser_student_removal.py && python tests/browser_tasks.py && python tests/browser_complaints.py && python tests/browser_experience.py && python tests/browser_notifications.py

      - name: Install application runtime for viewport regression
        run: python -m pip install -r requirements.txt
      - name: Audit published student resume on mobile and desktop
        run: python tests/browser_student_resume.py
      - name: Audit public pages at 320px through 1440px
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/ncet-responsive.sqlite3"
          export APP_ENV=development
          export PUBLIC_ORIGIN="http://127.0.0.1:8878"
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8878 > /tmp/ncet-responsive-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 4
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_responsive_audit.py
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_plot.py
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_not_found.py
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_institutional_motion.py

  security:
    name: Required Python SAST and dependency audit
    uses: ./.github/workflows/security.yml

  deploy-vps:
    name: Deploy verified main to Ubuntu VPS
    runs-on: ubuntu-24.04
    needs: [test, browser, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: ncet-vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure pinned SSH access
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Update the server after CI passed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_DEPLOY_PATH"
          DEPLOY_PATH_B64="$(printf '%s' "$VPS_DEPLOY_PATH" | base64 -w0)"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH_B64=$DEPLOY_PATH_B64 bash -s" \
            < deploy/vps-update.sh

      - name: Verify public VPS routes after deployment
        env:
          VPS_PUBLIC_ORIGIN: ${{ secrets.VPS_PUBLIC_ORIGIN }}
        run: bash deploy/vps-public-smoke.sh
