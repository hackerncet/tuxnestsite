name: NCET VerifyFlow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install OCR runtime used in production Docker image
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q tests/test_*.py
      - run: alembic upgrade head
      - name: Check migration drift
        run: alembic check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check static/app.js && node --check static/tasks.js
      - run: node --check static/notifications.js && node --check static/bca-oversight.js && node --check static/community.js && node --check static/student-portal.js && node --check static/bca-management.js && node --check static/public-home.js && node --check static/student-directory.js && node --check static/ncet-loading.js
      - run: node --check static/institutional-ui.js
      - run: node --check static/hod-dashboard.js

  browser:
    name: Chromium multi-role UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium and runtime libraries
        run: python -m playwright install --with-deps chromium
      - name: Test Admin, HOD, Staff, Principal, IQAC and mobile UI
        run: python tests/browser_ui.py && python tests/browser_bca.py && python tests/browser_tasks.py && python tests/browser_experience.py && python tests/browser_notifications.py

      - name: Install application runtime for viewport regression
        run: python -m pip install -r requirements.txt
      - name: Audit published student resume on mobile and desktop
        run: python tests/browser_student_resume.py
      - name: Audit public pages at 320px through 1440px
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/ncet-responsive.sqlite3"
          export APP_ENV=development
          export PUBLIC_ORIGIN="http://127.0.0.1:8878"
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8878 > /tmp/ncet-responsive-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 4
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_responsive_audit.py
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_not_found.py
          NCET_BASE_URL=http://127.0.0.1:8878 python tests/browser_institutional_motion.py
